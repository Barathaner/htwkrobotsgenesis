# Booster K1 locomotion — 16-DOF (12 legs + 4 arms).
# Unbenutzte DOFs (Shoulder_Roll, Elbow_Yaw, Kopf) per PD fix gehalten (fixed_joint_names).
# Obs dim = 9 + 3*16 = 57 (auto in K1_env.py). Nur deploy-fähige Größen (IMU + Gelenke + commands + Aktion).

env_cfg:
  num_actions: 16

  # Policy-gesteuerte Gelenke (Reihenfolge = Action-Order)
  joint_names:
    - ALeft_Shoulder_Pitch
    - Left_Elbow_Yaw
    - ARight_Shoulder_Pitch
    - Right_Elbow_Yaw
    - Left_Hip_Pitch
    - Left_Hip_Roll
    - Left_Hip_Yaw
    - Left_Knee_Pitch
    - Left_Ankle_Pitch
    - Left_Ankle_Roll
    - Right_Hip_Pitch
    - Right_Hip_Roll
    - Right_Hip_Yaw
    - Right_Knee_Pitch
    - Right_Ankle_Pitch
    - Right_Ankle_Roll

  # Per PD auf Default-Pose fixiert (nicht von der Policy gesteuert)
  fixed_joint_names:
    - AAHead_yaw
    - Head_pitch
    - Left_Shoulder_Roll
    - Right_Shoulder_Roll
    - Left_Elbow_Pitch
    - Right_Elbow_Pitch

  default_joint_angles:
    AAHead_yaw: 0.0
    Head_pitch: 0.2
    ALeft_Shoulder_Pitch: 0.0
    ARight_Shoulder_Pitch: 0.0
    Left_Shoulder_Roll: -1.5
    Right_Shoulder_Roll: 1.5
    Left_Elbow_Pitch: 0.1
    Right_Elbow_Pitch: 0.1
    Left_Elbow_Yaw: -1.0
    Right_Elbow_Yaw: 1.0
    Left_Hip_Pitch: -0.30
    Right_Hip_Pitch: -0.30
    Left_Hip_Roll: 0.0
    Right_Hip_Roll: 0.0
    Left_Hip_Yaw: 0.0
    Right_Hip_Yaw: 0.0
    Left_Knee_Pitch: 0.60
    Right_Knee_Pitch: 0.60
    Left_Ankle_Pitch: -0.30
    Right_Ankle_Pitch: -0.30
    Left_Ankle_Roll: 0.0
    Right_Ankle_Roll: 0.0

  # Per-joint PD [kp, kd] + Drehmoment-Limit [Nm] (Quelle: models/K1/K1_debug.py)
  joint_gains:
    AAHead_yaw: {kp: 40.0, kd: 1.0, effort: 6.0}
    Head_pitch: {kp: 40.0, kd: 1.0, effort: 6.0}
    ALeft_Shoulder_Pitch: {kp: 40.0, kd: 1.0, effort: 14.0}
    ARight_Shoulder_Pitch: {kp: 40.0, kd: 1.0, effort: 14.0}
    Left_Shoulder_Roll: {kp: 40.0, kd: 1.0, effort: 14.0}
    Right_Shoulder_Roll: {kp: 40.0, kd: 1.0, effort: 14.0}
    Left_Elbow_Pitch: {kp: 40.0, kd: 1.0, effort: 14.0}
    Right_Elbow_Pitch: {kp: 40.0, kd: 1.0, effort: 14.0}
    Left_Elbow_Yaw: {kp: 40.0, kd: 1.0, effort: 14.0}
    Right_Elbow_Yaw: {kp: 40.0, kd: 1.0, effort: 14.0}
    Left_Hip_Pitch: {kp: 200.0, kd: 5.0, effort: 68.0}
    Right_Hip_Pitch: {kp: 200.0, kd: 5.0, effort: 68.0}
    Left_Hip_Roll: {kp: 200.0, kd: 5.0, effort: 76.0}
    Right_Hip_Roll: {kp: 200.0, kd: 5.0, effort: 76.0}
    Left_Hip_Yaw: {kp: 150.0, kd: 4.0, effort: 38.3}
    Right_Hip_Yaw: {kp: 150.0, kd: 4.0, effort: 38.3}
    Left_Knee_Pitch: {kp: 250.0, kd: 6.0, effort: 112.0}
    Right_Knee_Pitch: {kp: 250.0, kd: 6.0, effort: 112.0}
    Left_Ankle_Pitch: {kp: 120.0, kd: 3.0, effort: 38.3}
    Right_Ankle_Pitch: {kp: 120.0, kd: 3.0, effort: 38.3}
    Left_Ankle_Roll: {kp: 120.0, kd: 3.0, effort: 38.3}
    Right_Ankle_Roll: {kp: 120.0, kd: 3.0, effort: 38.3}

  termination_if_roll_greater_than: 40
  termination_if_pitch_greater_than: 40
  base_init_pos: [0.0, 0.0, 0.56]
  base_init_quat: [1.0, 0.0, 0.0, 0.0]
  episode_length_s: 20.0
  resampling_time_s: 4.0
  action_scale: 0.25
  simulate_action_latency: true
  clip_actions: 100.0

  # Kamera für Rollout-Videos (K1_train_runner + gleiche Defaults wie K1_hero_test).
  video:
    res: [640, 480]
    camera_pos: [1.2, -4.2, 1.3]   # seitlich, etwas weiter weg
    camera_lookat: [0.0, 0.0, 0.5]
    camera_fov: 32
    follow: true
    follow_smoothing: 0.9
    hero_ghost: true
    hero_ghost_color: [0.55, 1.0, 0.55]   # hellgrün
    hero_ghost_opacity: 0.42

obs_cfg:
  obs_scales:
    lin_vel: 2.0
    ang_vel: 0.25
    dof_pos: 1.0
    dof_vel: 0.05

reward_cfg:
  tracking_sigma: 0.2            # exp(-err/sigma) Breite. Die Stride-Oszillation wird jetzt über die EMA
                                 # (tracking_ema_window_s) herausgemittelt → die perfekte Referenz erreicht
                                 # auch bei strengem 0.2 ~0.91 tracking. Strenger = präziseres Command-Tracking.
  tracking_ema_window_s: 0.5     # [s] Zeitfenster, über das die Ist-Geschw. fürs Tracking gemittelt wird (EMA).
                                 # Mittelt die natürliche Innerhalb-des-Schritts-Oszillation heraus, sodass
                                 # tracking das mittlere "Was" misst und style das per-Frame "Wie".

  # contact (net contact force on foot links, via RigidEntity.get_links_net_contact_force)
  foot_contact_force_threshold: 20.0  # [N] |F| on foot link above = in_contact

  # feet_air_time (klassisch legged_gym: Bonus = air_time − target beim Aufsetzen)
  feet_air_time_target: 0.25      # [s] Hero-Jog ~0.15–0.20 s Luftzeit/Schritt; 0.25 → Touchdown-Bonus ~0.6–0.8
  feet_air_cmd_threshold: 0.05    # [m/s] darunter kein Reward

  # leg_symmetry (alternierender Gang: ein Fuß schwingt, der andere stützt; dann Wechsel)
  leg_symmetry_ds_allow_s: 0.15      # [s] erlaubte Doppelstütz-Dauer je Phase (natürl. (2·stance_ratio−1)·period/2 ≈ 0.11)
  leg_symmetry_flight_allow_s: 0.20  # [s] erlaubte Flugphase je Schritt (Lauf/Jog hat natürliche Flugphasen ~0.1–0.2s); nur Überdauer bestraft

  # style (feature-matching Style-Reward gegen eine NPZ-Referenzmotion, siehe K1_env._reward_style)
  style_motion_file: walk/data/motions/k1_jogging_motion.npz  # relativ zur Repo-Root
  style_sigma: 1.0                # exp(-mean_sq_z/(2σ²)); kleiner = strenger an der Referenz

  # Gebundene Strafterme: jeder gibt tanh(quantity / σ) ∈ [0,1) zurück (0 = sauber, →1 = starke
  # Verletzung); Vorzeichen kommt aus reward_scales (negativ = Strafe). Kleineres σ = strenger
  # (sättigt früher gegen 1), größeres σ = milder/linearer nahe 0. Startwerte — bei Bedarf tunen.
  action_rate_sigma: 15.0   # an Referenz kalibriert (ΣΔaction²≈1.4 beim Jog) → Hero-Strafe ~0.09.
  feet_slip_sigma: 1.5      # Hero-kinematisch ~0.44 bei 0.5 (Replay-Artefakt); 1.5 → ~0.16, Training-Physik niedriger.
  leg_symmetry_sigma: 0.5
  dof_vel_sigma: 2000.0   # an Referenz kalibriert (Σdof_vel²≈212 beim Jog) → Hero-Strafe ~0.10 statt 0.99.
                          # style matcht dof_vel ohnehin gegen die Referenz; hier nur noch Schutz vor EXTREM-Geschw.
  orientation_sigma: 0.2
  ang_vel_xy_sigma: 6.0   # an Referenz kalibriert (Σω_xy²≈0.64 beim Jog) → Hero-Strafe ~0.10 statt 0.46.
  ang_vel_z_sigma: 1.0

  reward_scales:
    # ── Task (Hero-Ziel: raw_mean ≈ 0.9–1.0) ─────────────────────────────────────
    # Hero 2025-06: tracking_lin 0.91, tracking_ang 0.91, style 1.0, survival 1.0
    # → zusammen ~5.3/s Beitrag; dominieren das Return klar.
    tracking_lin_vel: 2.0   # primär: Command-Geschwindigkeit (EMA-geglättet)
    tracking_ang_vel: 0.75  # 0.5→0.75: yaw-Tracking wichtiger, Hero raw≈0.91 wie lin_vel
    survival: 1.0
    style: 2.0              # co-primär mit tracking: perfekter Gang = 1.0

    # ── Kontakt / Schritt ────────────────────────────────────────────────────────
    # feet_air_time: Impuls-Reward (nur Touchdown-Frames) → raw_mean immer klein (~0.03–0.08).
    # Scale hoch, damit der Beitrag trotzdem spürbar ist (Hero-Ziel ~0.1/s).
    feet_air_time: 4.0       # 1.5→4.0: Hero +0.04/s→~+0.10/s; style deckt Schwung mit ab
    feet_slip: -0.35         # -1.0→-0.35: Hero war -0.44/s (dominierte alle Strafen); σ=1.5 mildert tanh
    leg_symmetry: -0.25      # aktiviert: Hero ~0.10 → ~-0.025/s; sanfter Wechselschritt-Nudge

    # ── Regularizer (Hero-Ziel: raw_mean ≈ 0.05–0.12, klein vs. Task) ─────────
    action_rate: -0.05        # Hero ~0.09
    dof_vel: -0.05            # Hero ~0.11; style matcht dof_vel ohnehin
    ang_vel_xy: -0.05         # Hero ~0.11
    # ang_vel_z: deaktiviert — redundant zu tracking_ang_vel (EMA)
    orientation: -0.5         # -1.0→-0.5: Hero ~0.03, style deckt Rumpf-Orientierung ab

command_cfg:
  num_commands: 3
  # Nicht-Null-Minimum erzwingt stets Vorwärtsbewegung (steiler Gradient nahe v=0).
  # Referenz-Jog |v|≈0.93 m/s → Range deckt Referenztempo ab (style dof_vel/foot_clear passen besser).
  lin_vel_x_range: [0.5, 1.0]
  lin_vel_y_range: [0.0, 0.0]
  ang_vel_range: [0.0, 0.0]

# PPO / rsl-rl — obs_dim & num_actions kommen automatisch aus K1Env
train_cfg:
  algorithm:
    class_name: PPO
    clip_param: 0.2
    desired_kl: 0.01
    entropy_coef: 0.01
    gamma: 0.99
    lam: 0.95
    learning_rate: 0.001
    max_grad_norm: 1.0
    num_learning_epochs: 5
    num_mini_batches: 4
    schedule: adaptive
    use_clipped_value_loss: true
    value_loss_coef: 1.0

  actor:
    class_name: MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 1.0
      std_type: scalar

  critic:
    class_name: MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu

  obs_groups:
    actor: [policy]
    critic: [policy]

  num_steps_per_env: 48
  save_interval: 250
  video_interval: 250
  video_steps: 300
  video_fps: 50
  run_name: k1-walking
  wandb_project: k1-locomotion

  logger:
    class_name: WandbLogWriter
