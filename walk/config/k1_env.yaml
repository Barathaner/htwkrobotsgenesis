# Booster K1 locomotion — 16-DOF (12 legs + 4 arms).
# Unbenutzte DOFs (Shoulder_Roll, Elbow_Yaw, Kopf) per PD fix gehalten (fixed_joint_names).
# Obs dim = 9 + 3*16 + 2 + 2 + 2 = 63 (auto in K1_env.py).

env_cfg:
  num_actions: 16

  # Policy-gesteuerte Gelenke (Reihenfolge = Action-Order)
  joint_names:
    - ALeft_Shoulder_Pitch
    - Left_Elbow_Yaw
    - ARight_Shoulder_Pitch
    - Right_Elbow_Yaw
    - Left_Hip_Pitch
    - Left_Hip_Roll
    - Left_Hip_Yaw
    - Left_Knee_Pitch
    - Left_Ankle_Pitch
    - Left_Ankle_Roll
    - Right_Hip_Pitch
    - Right_Hip_Roll
    - Right_Hip_Yaw
    - Right_Knee_Pitch
    - Right_Ankle_Pitch
    - Right_Ankle_Roll

  # Per PD auf Default-Pose fixiert (nicht von der Policy gesteuert)
  fixed_joint_names:
    - AAHead_yaw
    - Head_pitch
    - Left_Shoulder_Roll
    - Right_Shoulder_Roll
    - Left_Elbow_Pitch
    - Right_Elbow_Pitch

  # Stehen: Hip/Knee/Ankle heben sich auf → beide Füße flach am Boden (siehe models/K1/K1_debug.py)
  default_joint_angles:
    AAHead_yaw: 0.0
    Head_pitch: 0.2
    ALeft_Shoulder_Pitch: 0.0
    ARight_Shoulder_Pitch: 0.0
    Left_Shoulder_Roll: -1.5
    Right_Shoulder_Roll: 1.5
    Left_Elbow_Pitch: 0.1
    Right_Elbow_Pitch: 0.1
    Left_Elbow_Yaw: -1.0
    Right_Elbow_Yaw: 1.0
    Left_Hip_Pitch: -0.30
    Right_Hip_Pitch: -0.30
    Left_Hip_Roll: 0.0
    Right_Hip_Roll: 0.0
    Left_Hip_Yaw: 0.0
    Right_Hip_Yaw: 0.0
    Left_Knee_Pitch: 0.60
    Right_Knee_Pitch: 0.60
    Left_Ankle_Pitch: -0.30   # mit Hip/Knee → flache Sohle
    Right_Ankle_Pitch: -0.30
    Left_Ankle_Roll: 0.0      # kein seitliches Kippen
    Right_Ankle_Roll: 0.0

  # Per-joint PD [kp, kd] + Drehmoment-Limit [Nm] (Quelle: models/K1/K1_debug.py)
  joint_gains:
    AAHead_yaw: {kp: 40.0, kd: 1.0, effort: 6.0}
    Head_pitch: {kp: 40.0, kd: 1.0, effort: 6.0}
    ALeft_Shoulder_Pitch: {kp: 40.0, kd: 1.0, effort: 14.0}
    ARight_Shoulder_Pitch: {kp: 40.0, kd: 1.0, effort: 14.0}
    Left_Shoulder_Roll: {kp: 40.0, kd: 1.0, effort: 14.0}
    Right_Shoulder_Roll: {kp: 40.0, kd: 1.0, effort: 14.0}
    Left_Elbow_Pitch: {kp: 40.0, kd: 1.0, effort: 14.0}
    Right_Elbow_Pitch: {kp: 40.0, kd: 1.0, effort: 14.0}
    Left_Elbow_Yaw: {kp: 40.0, kd: 1.0, effort: 14.0}
    Right_Elbow_Yaw: {kp: 40.0, kd: 1.0, effort: 14.0}
    Left_Hip_Pitch: {kp: 200.0, kd: 5.0, effort: 68.0}
    Right_Hip_Pitch: {kp: 200.0, kd: 5.0, effort: 68.0}
    Left_Hip_Roll: {kp: 200.0, kd: 5.0, effort: 76.0}
    Right_Hip_Roll: {kp: 200.0, kd: 5.0, effort: 76.0}
    Left_Hip_Yaw: {kp: 150.0, kd: 4.0, effort: 38.3}
    Right_Hip_Yaw: {kp: 150.0, kd: 4.0, effort: 38.3}
    Left_Knee_Pitch: {kp: 250.0, kd: 6.0, effort: 112.0}
    Right_Knee_Pitch: {kp: 250.0, kd: 6.0, effort: 112.0}
    Left_Ankle_Pitch: {kp: 120.0, kd: 3.0, effort: 38.3}
    Right_Ankle_Pitch: {kp: 120.0, kd: 3.0, effort: 38.3}
    Left_Ankle_Roll: {kp: 120.0, kd: 3.0, effort: 38.3}
    Right_Ankle_Roll: {kp: 120.0, kd: 3.0, effort: 38.3}

  termination_if_roll_greater_than: 30
  termination_if_pitch_greater_than: 30
  base_init_pos: [0.0, 0.0, 0.56]
  base_init_quat: [1.0, 0.0, 0.0, 0.0]
  episode_length_s: 20.0
  resampling_time_s: 4.0
  action_scale: 0.25
  simulate_action_latency: true
  clip_actions: 100.0

obs_cfg:
  obs_scales:
    lin_vel: 2.0
    ang_vel: 0.25
    dof_pos: 1.0
    dof_vel: 0.05

reward_cfg:
  tracking_sigma: 0.25            # exp(-err/sigma) Breite (tracking_lin_vel/ang_vel)
  base_height_target: 0.53        # [m]
  feet_height_target: 0.0

  # contact (net contact force on foot links, via RigidEntity.get_links_net_contact_force)
  foot_contact_force_threshold: 20.0  # [N] |F| on foot link above = in_contact
  foot_ground_clearance_margin: 0.035  # [m] über Referenz-h = Fuß gilt als angehoben
  stand_cmd_threshold: 0.2             # [m/s] darunter: Stehen-Rewards (feet_grounded) aktiv

  # feet_air_time (klassisch legged_gym: Bonus = air_time − target beim Aufsetzen)
  feet_air_time_target: 0.3       # [s] Soll-Luftzeit je Schritt; darüber Bonus, darunter Malus
  feet_air_cmd_threshold: 0.15    # [m/s] darunter kein Reward

  # leg_symmetry (alternierender Gang: ein Fuß schwingt, der andere stützt; dann Wechsel)
  leg_symmetry_ds_allow_s: 0.15   # [s] erlaubte Doppelstütz-Dauer je Phase (natürl. (2·stance_ratio−1)·period/2 ≈ 0.11)

  # foot_roll (kontinuierliches Heel-to-Toe via Ankle_Pitch, stance-phasen-gekoppelt)
  ankle_heel_target: -0.15        # [rad] Stance-Start (Touchdown)
  ankle_toe_target: 0.10          # [rad] Stance-Ende (Liftoff)
  foot_roll_sigma: 0.05
  foot_roll_cmd_threshold: 0.2    # [m/s] darunter kein Reward

  # flat_foot
  foot_flat_threshold: 0.03       # [rad] |Ankle_Pitch| darunter = flach
  foot_flat_time: 0.4             # [s] flach-in-Kontakt-Dauer ab Strafe

  # support_pose (Kniebeugung)
  support_knee_min: 0.4           # [rad]
  support_knee_max: 0.8           # [rad]
  support_pose_sigma: 0.05
  support_pose_cmd_speed: 0.6     # [m/s] nur darunter belohnen

  # SPRINT-Stil Fuß-Terme
  close_feet_d_min: 0.15          # [m] seitl. Mindestabstand (Basis-Frame)
  feet_air_height_target: 0.12    # [m] Soll-z Schwungfuß-Link (~5-6 cm über Sohle)
  feet_air_height_sigma: 0.03
  feet_guidance_t_target: 0.16    # [s] Mindest-Flugzeit
  feet_parallel_sigma: 0.08       # enger: Füße parallel auf flachem Boden
  feet_height_diff_sigma: 0.01    # [m] enger: gleiche Fußhöhe bei Doppelstütz

  # push (Robustheit; Soll-Δv [m/s])
  push_enabled: false
  push_interval_min_s: 2.0
  push_interval_max_s: 5.0
  push_vel_min: 0.3
  push_vel_max: 0.8

  # gait phase-clock
  gait_period_s: 1.1              # [s] voller Schrittzyklus
  gait_stance_ratio: 0.6          # Stance-Anteil je Fuß
  gait_phase_offset: 0.5          # L/R-Versatz (0.5 = alternierend)
  gait_cmd_threshold: 0.2         # [m/s] darunter kein Penalty

  # swing_quality (Strafe: koppelt Schwung-Clearance feet_air_height_target + Kniebeugung)
  swing_knee_flex_target: 0.15    # [rad] Soll-Flex über Default-Knie während Swing+Luft

  # torso_pitch (SPRINT r_reg: Vorne-Neigung via projected_gravity gx, aktiv Richtung gf)
  torso_pitch_target: 0.1         # gf: Soll-Vorne-Neigung (fix, nicht speed-abhängig)
  torso_pitch_backward: 0.0       # gb: extra Strafe bei Rück-Neigung (gx < gb)

  reward_scales:
    # task
    tracking_lin_vel: 1.5   # Heading-Frame (Spawn-Richtung), siehe K1_env._reward_tracking_lin_vel
    tracking_ang_vel: 0.5
    base_height: -10.0
    survival: 1.5
    lin_vel_z: -1.5
    action_rate: -0.5

    # gait (Stehen: kein Schritt — nur Kontakt + kein Rutschen)
    #feet_air_time: 3.0
    feet_slip: -1.5               # STRAFE: Fuß rutscht am Boden
    #gait_phase: -3.0
    # leg_symmetry = STRAFE für nicht-alternierenden Gang: both_air (Flugphase) sofort, Doppelstütze
    # nur über das natürliche Fenster hinaus. Bündelt die früher in feet_air_time/foot_roll/swing_quality
    # verteilte L/R-Kopplung in EINEN Term.
    #leg_symmetry: -1.0
    # swing_quality = BELOHNUNG clear_score·flex_score: koppelt Schwung-Clearance UND Kniebeugung
    # in EINER Metrik (ersetzt swing_clearance + swing_knee_flex). Magnitude ∈[0,1] je Fuß.
    #swing_quality: 3.5

    # SPRINT-Stil Fuß-Design
    # feet_stance = STRAFE 1 − sep_score·parallel_score·height_score: koppelt Mindestabstand, Parallelität
    # UND Höhengleichheit der Füße in EINER Metrik. Magnitude ∈[0,1], negativer Scale.
    # feet_not_both_contact = STRAFE: 1.0 wenn nicht beide Füße gleichzeitig am Boden.
    #feet_air_height: 5.0
    #feet_guidance: -15.0

    # foot style — Stehen mit beiden Füßen flach am Boden
    #foot_roll: 1.5   # nur beim Gehen: Heel-to-Toe (widerspricht flachem Stand)
    feet_stance: -3.0             # STRAFE: Füße nicht parallel / unterschiedliche Höhe
    feet_not_both_contact: -6.0   # STRAFE: nicht beide Füße wirklich am Boden (Kraft + Höhe)
    feet_grounded: -5.0          # STRAFE: Fuß zu weit über Boden beim Stehen
    #flat_foot: -0.6              # nur beim Gehen aktiv (cmd > threshold)
    support_pose: 2.0             # BELOHNUNG: stabile Kniebeugung beim Stehen

    # regularizer
    dof_vel: -2.0e-4
    ang_vel_xy: -0.05
    ang_vel_z: -0.0
    orientation: -2.0
    #torso_pitch: -3.0
    similar_to_default: -0.1      # STRAFE: von Default-Pose (flache Füße) abweichen

command_cfg:
  num_commands: 3
  # Nicht-Null-Minimum erzwingt stets Vorwärtsbewegung (steiler Gradient nahe v=0)
  lin_vel_x_range: [0.0, 0.0]
  lin_vel_y_range: [0.0, 0.0]
  ang_vel_range: [0.0, 0.0]

  # Kamera für Trainings-Rollout-Videos (K1_train_runner, 1 Env)
  video:
    res: [640, 480]
    camera_pos: [3.0, -1.0, 1.5]
    camera_lookat: [0.0, 0.0, 0.5]
    camera_fov: 30

# PPO / rsl-rl — obs_dim & num_actions kommen automatisch aus K1Env
train_cfg:
  algorithm:
    class_name: PPO
    clip_param: 0.2
    desired_kl: 0.01
    entropy_coef: 0.01
    gamma: 0.99
    lam: 0.95
    learning_rate: 0.001
    max_grad_norm: 1.0
    num_learning_epochs: 5
    num_mini_batches: 4
    schedule: adaptive
    use_clipped_value_loss: true
    value_loss_coef: 1.0

  actor:
    class_name: MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 1.0
      std_type: scalar

  critic:
    class_name: MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu

  obs_groups:
    actor: [policy]
    critic: [policy]

  num_steps_per_env: 48
  save_interval: 250
  video_interval: 250
  video_steps: 300
  video_fps: 50
  run_name: k1-walking
  wandb_project: k1-locomotion

  logger:
    class_name: WandbLogWriter
