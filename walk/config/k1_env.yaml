# Booster K1 locomotion — 16-DOF (12 legs + 4 arms).
# Unbenutzte DOFs (Shoulder_Roll, Elbow_Yaw, Kopf) per PD fix gehalten (fixed_joint_names).
# Obs dim = 3+3+3 + 2+2+1+1+1 + 16+16+16+2+2 = 66 (auto in K1_env.py). Privilegiert: lin_vel_heading(2), lin_vel_ema(2), ang_vel_z_ema(1), base_height(1), lin_vel_z(1). Deploy: gait_phase(2), feet_contact(2).

env_cfg:
  num_actions: 16

  # Policy-gesteuerte Gelenke (Reihenfolge = Action-Order)
  joint_names:
    - ALeft_Shoulder_Pitch
    - Left_Elbow_Yaw
    - ARight_Shoulder_Pitch
    - Right_Elbow_Yaw
    - Left_Hip_Pitch
    - Left_Hip_Roll
    - Left_Hip_Yaw
    - Left_Knee_Pitch
    - Left_Ankle_Pitch
    - Left_Ankle_Roll
    - Right_Hip_Pitch
    - Right_Hip_Roll
    - Right_Hip_Yaw
    - Right_Knee_Pitch
    - Right_Ankle_Pitch
    - Right_Ankle_Roll

  # Per PD auf Default-Pose fixiert (nicht von der Policy gesteuert)
  fixed_joint_names:
    - AAHead_yaw
    - Head_pitch
    - Left_Shoulder_Roll
    - Right_Shoulder_Roll
    - Left_Elbow_Pitch
    - Right_Elbow_Pitch

  default_joint_angles:
    AAHead_yaw: 0.0
    Head_pitch: 0.2
    ALeft_Shoulder_Pitch: 0.0
    ARight_Shoulder_Pitch: 0.0
    Left_Shoulder_Roll: -1.5
    Right_Shoulder_Roll: 1.5
    Left_Elbow_Pitch: 0.1
    Right_Elbow_Pitch: 0.1
    Left_Elbow_Yaw: -1.0
    Right_Elbow_Yaw: 1.0
    Left_Hip_Pitch: -0.30
    Right_Hip_Pitch: -0.30
    Left_Hip_Roll: 0.0
    Right_Hip_Roll: 0.0
    Left_Hip_Yaw: 0.0
    Right_Hip_Yaw: 0.0
    Left_Knee_Pitch: 0.60
    Right_Knee_Pitch: 0.60
    Left_Ankle_Pitch: -0.30
    Right_Ankle_Pitch: -0.30
    Left_Ankle_Roll: 0.0
    Right_Ankle_Roll: 0.0

  # Per-joint PD [kp, kd] + Drehmoment-Limit [Nm] (Quelle: models/K1/K1_debug.py)
  joint_gains:
    AAHead_yaw: {kp: 40.0, kd: 1.0, effort: 6.0}
    Head_pitch: {kp: 40.0, kd: 1.0, effort: 6.0}
    ALeft_Shoulder_Pitch: {kp: 40.0, kd: 1.0, effort: 14.0}
    ARight_Shoulder_Pitch: {kp: 40.0, kd: 1.0, effort: 14.0}
    Left_Shoulder_Roll: {kp: 40.0, kd: 1.0, effort: 14.0}
    Right_Shoulder_Roll: {kp: 40.0, kd: 1.0, effort: 14.0}
    Left_Elbow_Pitch: {kp: 40.0, kd: 1.0, effort: 14.0}
    Right_Elbow_Pitch: {kp: 40.0, kd: 1.0, effort: 14.0}
    Left_Elbow_Yaw: {kp: 40.0, kd: 1.0, effort: 14.0}
    Right_Elbow_Yaw: {kp: 40.0, kd: 1.0, effort: 14.0}
    Left_Hip_Pitch: {kp: 200.0, kd: 5.0, effort: 68.0}
    Right_Hip_Pitch: {kp: 200.0, kd: 5.0, effort: 68.0}
    Left_Hip_Roll: {kp: 200.0, kd: 5.0, effort: 76.0}
    Right_Hip_Roll: {kp: 200.0, kd: 5.0, effort: 76.0}
    Left_Hip_Yaw: {kp: 150.0, kd: 4.0, effort: 38.3}
    Right_Hip_Yaw: {kp: 150.0, kd: 4.0, effort: 38.3}
    Left_Knee_Pitch: {kp: 250.0, kd: 6.0, effort: 112.0}
    Right_Knee_Pitch: {kp: 250.0, kd: 6.0, effort: 112.0}
    Left_Ankle_Pitch: {kp: 120.0, kd: 3.0, effort: 38.3}
    Right_Ankle_Pitch: {kp: 120.0, kd: 3.0, effort: 38.3}
    Left_Ankle_Roll: {kp: 120.0, kd: 3.0, effort: 38.3}
    Right_Ankle_Roll: {kp: 120.0, kd: 3.0, effort: 38.3}

  termination_if_roll_greater_than: 40
  termination_if_pitch_greater_than: 40
  base_init_pos: [0.0, 0.0, 0.56]
  base_init_quat: [1.0, 0.0, 0.0, 0.0]
  episode_length_s: 20.0
  resampling_time_s: 4.0
  action_scale: 0.25
  simulate_action_latency: true
  clip_actions: 100.0

  # Kamera für Rollout-Videos (K1_train_runner + gleiche Defaults wie K1_hero_test).
  video:
    res: [640, 480]
    camera_pos: [1.2, -4.2, 1.3]   # seitlich, etwas weiter weg
    camera_lookat: [0.0, 0.0, 0.5]
    camera_fov: 32
    follow: true
    follow_smoothing: 0.9
    color_shadow: true                       # kinematic per-env colored copies; hides the physics robot
    hero_ghost: true
    hero_ghost_opacity: 0.55
    robot_color: [0.35, 0.35, 0.35]
    robot_roughness: 0.6
    plane_roughness: 0.95
    # Multi-env training video: show N envs in a grid to observe episode variety.
    num_envs: 4
    env_spacing: [3.0, 3.0]        # metres between env centres
    multi_camera_pos: [0.0, -9.0, 5.0]
    multi_camera_lookat: [0.0, 0.0, 0.5]
    multi_camera_fov: 55

  randomization:
    # ── Init-state noise (applied every episode reset) ─────────────────────
    init_dof_pos_noise: 0.10        # [rad] uniform noise on each joint at spawn
    init_base_height_noise: 0.02    # [m]   uniform noise on base z at spawn
    init_yaw_range: [-3.14159, 3.14159]  # [rad] random heading; set [0,0] to disable

    # ── Random pushes ────────────────────────────────────────────────────────
    push_enabled: true
    push_interval_s: 5.0            # [s] avg interval (Poisson: p = dt/interval per step)
    push_duration_steps: 5          # consecutive steps to sustain the push force
    push_force_xy_max: 150.0        # [N] max horizontal force magnitude (per axis)
    push_torque_z_max: 30.0         # [N·m] max yaw torque

    # ── Domain randomization (re-sampled every episode reset) ────────────────
    randomize_friction: true
    friction_range: [0.3, 2.5]      # multiplicative friction ratio per link

    randomize_mass: true
    mass_ratio_range: [0.7, 1.3]    # multiplicative mass ratio per link (always positive → no NaN)

    randomize_com: true
    com_shift_range: [-0.03, 0.03]  # [m] COM shift per axis per link

    randomize_motor_strength: true
    motor_strength_range: [0.8, 1.2]  # multiplicative scale on kp & kd

  # ── Curriculum learning ─────────────────────────────────────────────────────
  # Phases advance when advance_when.min_iterations have passed AND the rolling
  # mean of rew_tracking_lin_vel (per second) crosses advance_when.tracking_rew_per_sec.
  # With tracking_lin_vel scale=2.0 and dt=0.02: perfect tracking ≈ 100/s.
  # The final phase has no advance_when → stays there.
  curriculum:
    enabled: true
    eval_window: 150   # episodes to average for the advancement check

    phases:
      - name: slow_walk
        style_motion_file: walk/data/motions/slow.npz
        command_ranges:
          lin_vel_x_range: [-0.2, 0.8]
          lin_vel_y_range: [-0.4, 0.4]
          ang_vel_range:   [-0.5, 0.5]
        advance_when:
          min_iterations: 500
          tracking_rew_per_sec: 56.0   # ~60% of max (scale=2.0 → max≈100/s)

      - name: jog
        style_motion_file: walk/data/motions/k1_jogging_motion.npz
        command_ranges:
          lin_vel_x_range: [-0.4, 1.6]
          lin_vel_y_range: [-0.6, 0.6]
          ang_vel_range:   [-0.7, 0.7]
        advance_when:
          min_iterations: 500
          tracking_rew_per_sec: 56.0

      - name: all
        style_motion_file: walk/data/motions/k1_jogging_motion.npz
        command_ranges:
          lin_vel_x_range: [-0.8, 2.0]
          lin_vel_y_range: [-0.8, 1.0]
          ang_vel_range:   [-0.8, 0.8]
        # no advance_when → final phase

obs_cfg:
  obs_scales:
    lin_vel: 2.0
    ang_vel: 0.25
    dof_pos: 1.0
    dof_vel: 0.05

reward_cfg:
  tracking_sigma: 0.2            # exp(-err/sigma) Breite. Die Stride-Oszillation wird jetzt über die EMA
                                 # (tracking_ema_window_s) herausgemittelt → die perfekte Referenz erreicht
                                 # auch bei strengem 0.2 ~0.91 tracking. Strenger = präziseres Command-Tracking.
  tracking_ema_window_s: 0.5     # [s] Zeitfenster, über das die Ist-Geschw. fürs Tracking gemittelt wird (EMA).
                                 # Mittelt die natürliche Innerhalb-des-Schritts-Oszillation heraus, sodass
                                 # tracking das mittlere "Was" misst und style das per-Frame "Wie".

  # contact (net contact force on foot links, via RigidEntity.get_links_net_contact_force)
  foot_contact_force_threshold: 20.0  # [N] |F| on foot link above = in_contact

  # feet_air_time + gait_phase: gemeinsames Phase-Clock-Kontaktmodell (Siekmann/Margolis-Stil)
  feet_air_cmd_threshold: 0.05    # [m/s] darunter kein Schritt-Reward / keine Off-Beat-Strafe
  gait_period_s: 0.80             # [s] fester Schritt-Takt (φ∈[0,1), unabhängig von cmd_speed)
  gait_stance_ratio: 0.60          # Anteil der Periode in Stance je Fuß (Rest = Swing)
  gait_phase_offset: 0.50         # L/R-Versatz in φ (0.5 = anti-phasig)
  feet_air_sigma: 0.04             # Gauß-Breite für Luftzeit vs. Soll-Schwung (1−stance)·period
  feet_air_decay: 0.96             # foot_step_quality Zerfall/Step (Symmetrie-Kopplung)

  # leg_symmetry (alternierender Gang: ein Fuß schwingt, der andere stützt; dann Wechsel)
  leg_symmetry_ds_allow_s: 0.15      # [s] erlaubte Doppelstütz-Dauer je Phase (natürl. (2·stance_ratio−1)·period/2 ≈ 0.11)
  leg_symmetry_flight_allow_s: 0.20  # [s] erlaubte Flugphase je Schritt (Lauf/Jog hat natürliche Flugphasen ~0.1–0.2s); nur Überdauer bestraft

  # style (feature-matching Style-Reward gegen eine NPZ-Referenzmotion, siehe K1_env._reward_style)
  style_motion_file: walk/data/motions/k1_jogging_motion.npz  # relativ zur Repo-Root
  style_sigma: 1.0                # exp(-mean_sq_z/(2σ²)); nur genutzt wenn amp_disc_enabled: false

  # AMP adversarial style discriminator (Peng et al. 2021)
  # Replaces nearest-neighbour feature matching with a learned discriminator on (s_t, s_{t+1}) transitions.
  amp_disc_enabled: true
  amp_hidden_dims: [256, 128]
  amp_lr: 1.0e-4
  amp_grad_penalty: 10.0          # WGAN-GP weight; keeps discriminator Lipschitz
  amp_replay_size: 100000         # circular buffer of policy transitions for disc training

  # Gebundene Strafterme: jeder gibt tanh(quantity / σ) ∈ [0,1) zurück (0 = sauber, →1 = starke
  # Verletzung); Vorzeichen kommt aus reward_scales (negativ = Strafe). Kleineres σ = strenger
  # (sättigt früher gegen 1), größeres σ = milder/linearer nahe 0. Startwerte — bei Bedarf tunen.
  action_rate_sigma: 15.0   # an Referenz kalibriert (ΣΔaction²≈1.4 beim Jog) → Hero-Strafe ~0.09.
  feet_slip_sigma: 1.5      # Hero-kinematisch ~0.44 bei 0.5 (Replay-Artefakt); 1.5 → ~0.16, Training-Physik niedriger.
  leg_symmetry_sigma: 0.5
  dof_vel_sigma: 2000.0   # an Referenz kalibriert (Σdof_vel²≈212 beim Jog) → Hero-Strafe ~0.10 statt 0.99.
                          # style matcht dof_vel ohnehin gegen die Referenz; hier nur noch Schutz vor EXTREM-Geschw.
  orientation_sigma: 0.2
  ang_vel_xy_sigma: 6.0   # an Referenz kalibriert (Σω_xy²≈0.64 beim Jog) → Hero-Strafe ~0.10 statt 0.46.
  ang_vel_z_sigma: 1.0
  base_height_target: 0.56   # [m] Ziel-Rumpfhöhe = Spawn-Höhe; hält den Roboter aufrecht
  base_height_sigma: 0.01    # tanh(Δz²/σ): bei 10cm Abweichung → ~0.76; bei 5cm → ~0.24
  lin_vel_z_sigma: 0.5       # tanh(vz²/σ): bei 0.5 m/s → ~0.46; bei 1.0 m/s → ~0.96

  reward_scales:
    # ── Task (Hero-Ziel: raw_mean ≈ 0.9–1.0) ─────────────────────────────────────
    # Hero 2025-06: tracking_lin 0.91, tracking_ang 0.91, style 1.0, survival 1.0
    # → zusammen ~5.3/s Beitrag; dominieren das Return klar.
    tracking_lin_vel: 2.0   # primär: Command-Geschwindigkeit (EMA-geglättet)
    tracking_ang_vel: 0.75  # 0.5→0.75: yaw-Tracking wichtiger, Hero raw≈0.91 wie lin_vel
    #survival: 1.0
    style: 2.0              # co-primär mit tracking: perfekter Gang = 1.0

    # ── Kontakt / Schritt ────────────────────────────────────────────────────────
    # feet_air_time: On-Beat-Touchdown + kadenz-treue Luftzeit (s. _update_foot_contact)
    feet_air_time: 7.0       # Event-Reward; Scale hoch wegen seltener On-Beat-Landungen
    feet_slip: -0.5         # -1.0→-0.35: Hero war -0.44/s (dominierte alle Strafen); σ=1.5 mildert tanh
    leg_symmetry: -0.25      # aktiviert: Hero ~0.10 → ~-0.025/s; sanfter Wechselschritt-Nudge
    gait_phase: -0.8          # Strafe: Off-Beat-Kontakt (0–2 Fuß-Fehler/Step), negatives Vorzeichen

    # ── Regularizer (Hero-Ziel: raw_mean ≈ 0.05–0.12, klein vs. Task) ─────────
    action_rate: -0.1        # Hero ~0.09
    dof_vel: -0.05            # Hero ~0.11; style matcht dof_vel ohnehin
    ang_vel_xy: -0.05        # Hero ~0.11
    # ang_vel_z: deaktiviert — redundant zu tracking_ang_vel (EMA)
    orientation: -0.5         # -1.0→-0.5: Hero ~0.03, style deckt Rumpf-Orientierung ab
    base_height: -1.0         # Hocken/Aufbäumen bestrafen; raw ≈0 bei gutem Gehen, steigt bei Sturz
    lin_vel_z: -0.5           # Bouncing/Hüpfen dämpfen; reagiert früher als base_height

command_cfg:
  num_commands: 3
  lin_vel_x_range: [-0.8, 2.0]   # negative: occasional backward walking
  lin_vel_y_range: [-0.8, 1.0]   # lateral stepping
  ang_vel_range: [-0.8, 0.8]     # turning

# PPO / rsl-rl — obs_dim & num_actions kommen automatisch aus K1Env
train_cfg:
  algorithm:
    class_name: PPO
    clip_param: 0.2
    desired_kl: 0.01
    entropy_coef: 0.01
    gamma: 0.99
    lam: 0.95
    learning_rate: 0.001
    max_grad_norm: 1.0
    num_learning_epochs: 5
    num_mini_batches: 4
    schedule: adaptive
    use_clipped_value_loss: true
    value_loss_coef: 1.0

  actor:
    class_name: MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 1.0
      std_type: scalar

  critic:
    class_name: MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu

  obs_groups:
    actor: [policy]
    critic: [policy]

  num_steps_per_env: 48
  save_interval: 250
  video_interval: 250
  video_steps: 300
  video_fps: 50
  run_name: k1-walking
  wandb_project: k1-locomotion

  logger:
    class_name: WandbLogWriter
