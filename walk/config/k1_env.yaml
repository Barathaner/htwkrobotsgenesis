# Booster K1 locomotion — 20-DOF (legs + arms; head not actuated)
# Obs dim = 9 + 3*20 + 2 (heading vx,vy) + 2 (gait phase sin/cos) + 2 (L/R foot contact) = 75 (auto in K1_env.py)

env_cfg:
  num_actions: 20

  # Policy action order — all actuated joints (must match default_joint_angles keys)
  joint_names:
    # left arm
    - ALeft_Shoulder_Pitch
    - Left_Shoulder_Roll
    - Left_Elbow_Pitch
    - Left_Elbow_Yaw
    # right arm
    - ARight_Shoulder_Pitch
    - Right_Shoulder_Roll
    - Right_Elbow_Pitch
    - Right_Elbow_Yaw
    # left leg
    - Left_Hip_Pitch
    - Left_Hip_Roll
    - Left_Hip_Yaw
    - Left_Knee_Pitch
    - Left_Ankle_Pitch
    - Left_Ankle_Roll
    # right leg
    - Right_Hip_Pitch
    - Right_Hip_Roll
    - Right_Hip_Yaw
    - Right_Knee_Pitch
    - Right_Ankle_Pitch
    - Right_Ankle_Roll

  # Kopfgelenke: NICHT von der Policy gesteuert, aber per PD auf fester Pose gehalten
  # (sonst schlackert der Kopf lose mit). Ziel = head_fixed_angles, geradeaus + leicht nach unten.
  head_joint_names:
    - AAHead_yaw
    - Head_pitch

  default_joint_angles:
    # Kopf: geradeaus (yaw 0) und leicht nach unten geneigt (pitch +, Limit +0.855) → Blick auf den Ball
    AAHead_yaw: 0.0
    Head_pitch: 0.2
    ALeft_Shoulder_Pitch: 0.0
    ARight_Shoulder_Pitch: 0.0
    Left_Shoulder_Roll: -1.5
    Right_Shoulder_Roll: 1.5
    Left_Elbow_Pitch: 0.1
    Right_Elbow_Pitch: 0.1
    Left_Elbow_Yaw: 0.0
    Right_Elbow_Yaw: 0.0
    Left_Hip_Pitch: -0.30
    Right_Hip_Pitch: -0.30
    Left_Hip_Roll: 0.0
    Right_Hip_Roll: 0.0
    Left_Hip_Yaw: 0.0
    Right_Hip_Yaw: 0.0
    Left_Knee_Pitch: 0.60
    Right_Knee_Pitch: 0.60
    Left_Ankle_Pitch: -0.30
    Right_Ankle_Pitch: -0.30
    Left_Ankle_Roll: 0.0
    Right_Ankle_Roll: 0.0

  # Per-joint PD [kp, kd] and torque limits [Nm] — source: models/K1/K1_debug.py
  joint_gains:
    # Kopf: steif genug halten, damit er trotz Rumpfbewegung ruhig in head_fixed-Pose bleibt
    AAHead_yaw: {kp: 40.0, kd: 1.0, effort: 6.0}
    Head_pitch: {kp: 40.0, kd: 1.0, effort: 6.0}
    ALeft_Shoulder_Pitch: {kp: 40.0, kd: 1.0, effort: 14.0}
    ARight_Shoulder_Pitch: {kp: 40.0, kd: 1.0, effort: 14.0}
    Left_Shoulder_Roll: {kp: 40.0, kd: 1.0, effort: 14.0}
    Right_Shoulder_Roll: {kp: 40.0, kd: 1.0, effort: 14.0}
    Left_Elbow_Pitch: {kp: 40.0, kd: 1.0, effort: 14.0}
    Right_Elbow_Pitch: {kp: 40.0, kd: 1.0, effort: 14.0}
    Left_Elbow_Yaw: {kp: 40.0, kd: 1.0, effort: 14.0}
    Right_Elbow_Yaw: {kp: 40.0, kd: 1.0, effort: 14.0}
    Left_Hip_Pitch: {kp: 200.0, kd: 5.0, effort: 68.0}
    Right_Hip_Pitch: {kp: 200.0, kd: 5.0, effort: 68.0}
    Left_Hip_Roll: {kp: 200.0, kd: 5.0, effort: 76.0}
    Right_Hip_Roll: {kp: 200.0, kd: 5.0, effort: 76.0}
    Left_Hip_Yaw: {kp: 150.0, kd: 4.0, effort: 38.3}
    Right_Hip_Yaw: {kp: 150.0, kd: 4.0, effort: 38.3}
    Left_Knee_Pitch: {kp: 250.0, kd: 6.0, effort: 112.0}
    Right_Knee_Pitch: {kp: 250.0, kd: 6.0, effort: 112.0}
    Left_Ankle_Pitch: {kp: 120.0, kd: 3.0, effort: 38.3}
    Right_Ankle_Pitch: {kp: 120.0, kd: 3.0, effort: 38.3}
    Left_Ankle_Roll: {kp: 120.0, kd: 3.0, effort: 38.3}
    Right_Ankle_Roll: {kp: 120.0, kd: 3.0, effort: 38.3}

  termination_if_roll_greater_than: 30
  termination_if_pitch_greater_than: 30
  base_init_pos: [0.0, 0.0, 0.56]
  base_init_quat: [1.0, 0.0, 0.0, 0.0]
  episode_length_s: 20.0
  resampling_time_s: 4.0
  action_scale: 0.25
  simulate_action_latency: true
  clip_actions: 100.0

  # Widerstands-Curriculum: virtueller Zug am Rumpf-COM (Welt-xy), der ENTGEGEN der kommandierten
  # Bewegung wirkt — der Roboter muss sich dagegen lehnen und aktiv anlaufen, um Fortschritt zu
  # machen (Resistance-Training). Magnitude folgt einer GLOCKENKURVE: klein (start_scale) zu Beginn
  # → Maximum bei peak_steps → wieder kleiner → über decay_steps auf scale_min ausgeblendet.
  # Gegenstück zum Push (reward_cfg.push_*): Push STÖRT impulsiv, dieser Widerstand BREMST gerichtet.
  #   force = scale · ( −force_kp·v_ist            [Drag entgegen der Ist-Bewegung]
  #                    − force_dir·cmd_dir )        [konstanter Gegen-Zug ENTGEGEN der Kommandorichtung]
  # |Gesamtkraft| auf force_max [N] gedeckelt, am COM (reine Linearkraft, kein Stör-Drehmoment).
  # NICHT in der Observation. Für Eval: enabled=false.
  assist:
    enabled: true
    force_kp: 40.0          # [N pro m/s] geschwindigkeitsproportionaler Drag entgegen der Ist-Bewegung
    force_dir: 30.0         # [N] konstanter Gegen-Zug ENTGEGEN der Kommandorichtung ("Gegenwind")
    force_max: 80.0         # [N] Deckel des xy-Kraftbetrags (Sicherheits-Obergrenze)
    # Effektive Skala = time_scale · perf_factor (beide in [.., 1]). time_scale ist eine GLOCKENKURVE:
    #   total_steps ≤ peak_steps:  start_scale → 1.0   (Anstieg: kleine Anfangskraft, steigend)
    #   total_steps > peak_steps:  1.0 → scale_min     (Abfall bis ausgeblendet bei decay_steps)
    #   perf_factor = 1 − (1−perf_floor)·clamp(acc_ema/accuracy_target, 0, 1)  → Performance-Gate
    # Läuft der Roboter gut (command_accuracy ↑), fällt perf_factor auf perf_floor (NICHT 0) → der
    # Widerstand wird etwas entlastet; ganz weg ist er erst nach dem Zeit-Abbau bei decay_steps.
    start_scale: 0.2        # kleine Anfangskraft als Anteil des Maximums (Glocken-Start)
    peak_steps: 50000       # [env-steps] Step, an dem der Widerstand sein Maximum (time_scale=1.0) erreicht
    decay_steps: 200000     # [env-steps] Step, an dem der Widerstand vollständig auf scale_min ausgeblendet ist
    scale_min: 0.0          # Rest-Widerstand nach dem Abbau (0 = vollständig entfernt)
    accuracy_target: 0.7    # command_accuracy-EMA, ab der das Gate voll greift
    perf_floor: 0.5         # Rest-Anteil des Gates bei erreichtem Ziel (×time_scale) → nie 0 vor Zeitablauf
    perf_ema: 0.01          # Glättung der command_accuracy-EMA (pro Step)

obs_cfg:
  obs_scales:
    lin_vel: 2.0
    ang_vel: 0.25
    dof_pos: 1.0
    dof_vel: 0.05

reward_cfg:
  tracking_sigma: 0.25
  base_height_target: 0.53
  feet_height_target: 0.0
  # Fuß-Kontakt-Proxy (Höhe): Fuß "am Boden" wenn z < foot_contact_height; Touchdown = Flanke hoch→Kontakt.
  foot_contact_height: 0.08       # [m] z-Schwelle Foot-Link-Ursprung (sitzt ~5-6 cm über Sohle;
                                  # 0.08 erfasst Stand beider Füße zuverlässig, 0.04 verfehlt den rechten)
  # feet_air_time: belohnt Luftphase beim Aufsetzen → Füße müssen abheben (Bodenfreiheit, kein Schlurfen)
  feet_air_time_min: 0.05         # [s] Mindest-Luftphase, bevor gezählt wird (0.12→0.08→0.05: Landungen
                                  #     blieben drunter = Reward 0 = kein Gradient; 0.05 gibt erstes Abheb-Signal)
  feet_air_time_max: 0.25         # [s] Cap pro Lande-Event
  feet_air_cmd_threshold: 0.15    # [m/s] — darunter (Stehen) kein Reward (war 0.2 → bei langsamem
                                  #     Anlauf unter Assist kein Abheb-Reward; 0.15 lässt ihn früher zählen)
  # foot_roll: Heel-to-Toe-Abrollen über Ankle_Pitch (keine separaten Zeh/Hacken-Links im URDF).
  # Aufsetzen → Hacke (heel_target); letzte ~3 Steps vor Liftoff → Zeh (toe_target).
  ankle_heel_target: -0.15        # [rad] Ziel-Ankle_Pitch beim Touchdown (Ferse zuerst)
  ankle_toe_target: 0.10          # [rad] Ziel-Ankle_Pitch kurz vor Liftoff (Abdruck über Zeh)
  foot_roll_sigma: 0.05           # [rad²] Breite der exp-Belohnung um heel/toe-target
  foot_roll_window_steps: 3       # Anzahl Steps vor Liftoff, über die die Zeh-Pose gemittelt wird
  foot_roll_cmd_threshold: 0.2    # [m/s] — darunter (Stehen) kein foot_roll-Reward
  foot_flat_threshold: 0.03       # [rad] |Ankle_Pitch| darunter = Fuß flach
  # foot_flat_time hoch (0.4 s): ein flach geplanter Stützfuß im Mid-Stance ist KORREKT und darf
  # nicht bestraft werden; bestraft wird nur dauerhaft flach hängender Fuß (Schlurfen ohne Abrollen).
  # Echtes Schlurfen fängt zusätzlich feet_slip (Fuß-Horizontalgeschwindigkeit im Kontakt) ab.
  foot_flat_time: 0.4             # [s] flach-in-Kontakt-Dauer, ab der bestraft wird
  # support_pose: leichte Kniebeugung (Federung) beim Stehen/langsamen Gehen
  support_knee_min: 0.4           # [rad] untere Grenze gewünschter Kniebeugung
  support_knee_max: 0.8           # [rad] obere Grenze gewünschter Kniebeugung
  support_pose_sigma: 0.05        # [rad²] eigener Falloff am Bandrand (entkoppelt von foot_roll_sigma)
  support_pose_cmd_speed: 0.6     # [m/s] — nur darunter (Stehen/langsam) belohnen
  # push_robustness (Stage 3): zufälliger Horizontal-Stoß auf den Rumpf zum Robustheits-Training.
  # WICHTIG: als Soll-Δv [m/s] parametriert, NICHT als roher Impuls [N·s] — bei ~10 kg Robotermasse
  # wären 50–150 N·s = 5–15 m/s und damit garantiert unaufholbar (sofortiger Sturz).
  push_enabled: false             # Stage-3-Schalter (Standard aus → bestehendes Training unverändert)
  push_interval_min_s: 2.0        # [s] kürzester Abstand zwischen Pushes (je Env zufällig)
  push_interval_max_s: 5.0        # [s] längster Abstand zwischen Pushes (je Env zufällig)
  push_vel_min: 0.3               # [m/s] untere Grenze des aufgeprägten Δv
  push_vel_max: 0.8               # [m/s] obere Grenze des aufgeprägten Δv
  # Phase-Clock (Siekmann 2021 / Margolis "Walk These Ways" 2022): periodischer Gangtakt
  # ergänzt foot_roll/flat_foot (Style) und ersetzt frühere Hand-Shaping-Terme.
  # Linkes/rechtes Bein laufen mit gait_phase_offset versetzt → erzwingt Alternation & Kadenz.
  # sin/cos(2π·phase) gehen zusätzlich in die Observation (Policy kann den Takt timen).
  # 0.9 statt 0.7: ein 0.5 m-Bein hat als Pendel eine Eigen-Halbschwingung von ~π·√(L/g)≈0.7 s
  # → natürlicher Vollzyklus ~1.4 s. Bei 0.7 s erzwang der Takt eine 0.28 s-Swingphase (~2× zu
  # schnell) → die Policy kämpft gegen die Beindynamik und nimmt nur kurze, steife Trippelschritte
  # (kein Drehimpuls → kein emergenter Armschwung). 0.9 s rückt Richtung Eigenfrequenz → längere,
  # entspanntere Schritte; bewusst nicht ganz 1.4 s, sonst werden Schritte bei hohem Curriculum-vx
  # unrealistisch lang (Stride ≈ vx·period/2).
  gait_period_s: 1.1              # [s] Dauer eines vollen Schrittzyklus (war 0.9 → erzwang kurze, hastige
                                  #     Schritte/Trippeln; 1.1 näher an der Bein-Eigenfrequenz → längere Swingphase)
  gait_stance_ratio: 0.6          # Anteil des Zyklus mit Bodenkontakt je Fuß (Duty; >0.5 → Double-Support-Überlapp)
  gait_phase_offset: 0.5          # Phasenversatz Links/Rechts (0.5 = exakt alternierend)
  gait_cmd_threshold: 0.2         # [m/s] darunter (Stehen) kein Gait-Penalty; Takt läuft aber weiter

  # Reward-Curriculum (Style-Ramp): "erst laufen, dann Stil". Die unter 'terms' gelisteten Polish-
  # Terme werden erst hochgefahren, sobald die Tracking-Qualität cmd_curr_perf (0..1, gemessen über
  # command_accuracy je Episode) 'threshold' übersteigt — dann öffnet ein gelatchtes Gate und
  # style_weight läuft über 'ramp_s' Sim-Sekunden linear 0→1 (skaliert NUR die terms; Task-/
  # Survival-Terme bleiben stets voll). Logik: K1_env._current_style_weight / _update_style_curriculum.
  # enabled=false → alle Terme dauerhaft voll (kein Ramp). Fortschritt: episode/curriculum_style_weight.
  style_curriculum:
    enabled: true
    threshold: 0.6      # cmd_curr_perf (0..1), ab der das Gate öffnet (war 0.5 → öffnete zu früh:
                        #     grobes Vorwärtslurchen reicht schon für ~0.5, der Gang ist da noch schlecht)
    warmup_s: 120.0     # [s] harte Zeit-Sperre: das Gate kann FRÜHESTENS nach warmup_s Sim-Sekunden
                        #     öffnen, egal wie hoch cmd_curr_perf ist (verhindert sofortiges Aktivieren,
                        #     solange der Gang noch instabil ist). 0 = keine Sperre.
    ema: 0.1            # Glättungsfaktor der cmd_curr_perf-Schätzung (höher = reaktiver)
    ramp_s: 60.0        # [s] Sim-Zeit für den linearen Anstieg style_weight 0→1 nach Gate-Öffnung
    terms:              # müssen in reward_scales AKTIV sein (sonst Assertion in K1_env.__init__)
      - foot_roll
      #- flat_foot
      - support_pose
  reward_scales:
    # Step-by-step reward tuning — Scales in reward_scales unten
    base_height: -50.0
    #similar_to_default: -0.1
    lin_vel_z: -1.0
    action_rate: -0.005
    #tracking_lin_vel: 1.0
    # Heading-/Weltframe: verhindert Drift — cmd [vx,vy] = Soll in Spawn-Richtung, nicht Körperframe.
    command_accuracy: 1.0
    # tracking_ang_vel gesenkt (war 1.0): yaw-Command ist konstant 0 → das war ein
    # garantiertes +1.0/s Stehen-Einkommen, das mit dem Laufen konkurrierte (Stehen-Attraktor).
    tracking_ang_vel: 0.25
    # --- Gait: literatur-standard Footstep-Terme behalten ---
    feet_air_time: 5.0        # war 0.5/1.2 → bei Trippeln nahe 0 und viel zu schwach vs. Slip;
                              #         3.0 belohnt echtes Fuß-Abheben klar stärker als Schlurfen
    feet_slip: -0.6           # war -0.2 → Schlurfen muss teurer sein als Trippeln (Anti-Schlurf/Rutsch)
    gait_phase: -0.8          # TEMPORÄR gesenkt (war -1.0): reine Takt-Strafe ohne belohntes Abheben
                              #         (feet_air_time war tot) unterdrückte das Stepping-Risiko. Zurück auf
                              #         -0.8/-1.0, SOBALD rew_feet_air_time > 0 (Füße heben wieder ab).
    # --- Standard-Regularisierer (legged-gym-Stil) ---
    dof_vel: -2.0e-4          # leichte Energie-/Vibrationsbremse über Gelenkgeschwindigkeiten
    orientation: -2.0         # Haltung aufrecht (roll²+pitch², in rad)
    ang_vel_xy: -0.05         # Roll/Pitch-Raten dämpfen, ohne den natürlichen Rumpf-Schwung zu überdämpfen
    # --- Style/Polish-Terme: aktiv, aber via style_curriculum gerampt (greifen erst NACH dem
    #     Laufenlernen, s. reward_cfg.style_curriculum + K1_env._current_style_weight). Genau das
    #     "erst Gang, dann Feintuning", nur automatisch statt manuell wieder einkommentieren. ---
    # Hochgezogen (~3×): bei den alten Werten waren die Style-Beiträge ~0.004–0.01/Step und gingen
    # gegen feet_air_time(3.0)/tracking(1.0)/orientation(-2.0) unter → kein sichtbarer Stil-Effekt.
    foot_roll: 1.5           # Heel-to-Toe-Abrollen (Ankle_Pitch-Proxy); Event-Reward (~1.5*dt pro Touchdown/Liftoff)
    #flat_foot: -0.6          # Strafe für dauerhaft flach hängenden Fuß (ergänzt foot_roll)
    support_pose: 0.6        # leichte Kniebeugung beim Stehen/langsam (Federung, bend knees)
    #similar_to_default: -0.03 # war -0.1 (~-0.34/s, größter Penalty!) → begünstigte stehende Default-
                              #          Pose mit hektischen Füßen statt echtem Gang; abgeschwächt

command_cfg:
  num_commands: 3
  # Lernbarer Geschwindigkeitsbereich mit NICHT-Null-Minimum: zwingt stets Vorwärtsbewegung
  # und hält den tracking_lin_vel-Gradienten nahe v=0 steil (exp(-v²/sigma) fällt schnell).
  # War [0.0, 2]: bei ~1–2 m/s ist exp(-v²/0.25)≈0 → flacher Gradient → Stehen-Attraktor.
  # 2 m/s (~4 Körperlängen/s) ist ohnehin kaum erreichbar; später schrittweise nach oben weiten.
  lin_vel_x_range: [0.3, 0.8]     # fixer vx-Sollbereich (Nicht-Null-Minimum erzwingt stets Vorwärts)
  lin_vel_y_range: [0.0, 0.0]
  ang_vel_range: [0.0, 0.0]

  # Camera for training rollout videos (used by K1_train_runner, 1 env only)
  video:
    res: [640, 480]
    camera_pos: [3.0, -1.0, 1.5]
    camera_lookat: [0.0, 0.0, 0.5]
    camera_fov: 30

# PPO / rsl-rl — obs_dim & num_actions come from K1Env automatically
train_cfg:
  algorithm:
    class_name: PPO
    clip_param: 0.2
    desired_kl: 0.01
    entropy_coef: 0.01  # 0.01→0.004→0.008: 0.004 ließ action_std auf ~0.27 kollabieren (festgefahren im
                         #        Assist-Shuffle); wieder höher hält Exploration offen, ohne 1.41-Zappeln
    gamma: 0.99
    lam: 0.95
    learning_rate: 0.001
    max_grad_norm: 1.0
    num_learning_epochs: 5
    num_mini_batches: 4
    schedule: adaptive
    use_clipped_value_loss: true
    value_loss_coef: 1.0

  actor:
    class_name: MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 1.0  # zurück auf 1.0 → mehr Anfangs-Exploration, damit die Policy nicht früh in den
                     #        Assist-Shuffle kollabiert (vgl. entropy_coef)
      std_type: scalar

  critic:
    class_name: MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu

  obs_groups:
    actor: [policy]
    critic: [policy]

  num_steps_per_env: 24
  save_interval: 250
  video_interval: 250
  video_steps: 300
  video_fps: 50
  run_name: k1-walking
  wandb_project: k1-locomotion

  logger:
    class_name: WandbLogWriter
    # project_name filled from wandb_project at train start
