# Optuna study: tune reward_scales in k1_env.yaml.
# search_space: absolute scale values (low/high), NOT multipliers.
# Penalties are negative (low = stärkere Strafe, high = milder, näher an 0).

study:
  n_trials: 50
  sampler: TPE
  pruner: median
  storage: logs/optuna/k1_reward_tune.db
  study_name: k1-reward-tune

trial:
  max_iterations: 3001
  num_envs: 2048
  seed: 42
  eval_steps: 1000
  report_interval: 100
  save_interval: 10000   # effectively no checkpoints during tuning
  wandb_project: k1-optuna-tune
  # Two Genesis scenes in one process is unsupported — keep video disabled for Optuna trials.
  enable_video: false

# Scales listed here are NOT tuned (baseline from k1_env.yaml kept).
fixed_scales: []

search_space:
  # ── Task (positiv) — Baseline in k1_env.yaml in Klammern ─────────────────
  tracking_lin_vel: {low: 1.0,  high: 8.0,  log: true}   # (4.0)  primär
  tracking_ang_vel: {low: 0.3,  high: 3.0,  log: true}   # (1.5)
  survival:         {low: 0.5,  high: 5.0,  log: true}   # (2.0)  alive anchor
  feet_air_time:    {low: 4.0,  high: 30.0, log: true}   # (14.0) event; mean() ∈ [0,0.5]/step

  # ── Kontakt / Schritt ─────────────────────────────────────────────────────
  feet_slip:        {low: -1.0,  high: -0.05}             # (-0.5)
  gait_phase:       {low: -2.0,  high: -0.1}              # (-0.8)

  # ── Regularizer ──────────────────────────────────────────────────────────
  action_rate:      {low: -0.5,  high: -0.02}             # (-0.15)
  ang_vel_xy:       {low: -0.5,  high: -0.02}             # (-0.1)
  base_height:      {low: -3.0,  high: -0.1}              # (-1.0)
  lin_vel_z:        {low: -1.0,  high: -0.05}             # (-0.3)

# ── AMP / train_cfg Parameter ──────────────────────────────────────────────
amp_search_space:
  style_weight:     {low: 0.1,  high: 0.7}                # (0.5)
  amp_reward_scale: {low: 0.02, high: 0.5,  log: true}   # (0.1)  now calibrated to task magnitude

objective:
  weights:
    tracking_lin_vel: 2.5
    tracking_ang_vel: 1.5
    survival: 1.0
    feet_air_time: 1.0
    feet_slip: -0.3
    gait_phase: -0.3
    base_height: -0.2
    lin_vel_z: -0.1
