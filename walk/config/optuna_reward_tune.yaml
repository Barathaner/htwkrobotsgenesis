# Optuna study: tune reward_scales in k1_env.yaml.
# search_space: absolute scale values (low/high), NOT multipliers.
# Penalties are negative (low = stärkere Strafe, high = milder, näher an 0).

study:
  n_trials: 50
  sampler: TPE
  pruner: median
  storage: logs/optuna/k1_reward_tune.db
  study_name: k1-reward-tune

trial:
  max_iterations: 1000
  num_envs: 2048
  seed: 42
  eval_steps: 1000
  report_interval: 100
  save_interval: 10000   # effectively no checkpoints during tuning
  wandb_project: k1-optuna-tune
  video_interval: 500    # weniger Videos → schnellere Trials

# Scales listed here are NOT tuned (baseline from k1_env.yaml kept).
fixed_scales:
  - survival

search_space:
  # ── Task (positiv) ───────────────────────────────────────────────────────
  tracking_lin_vel: {low: 0.5,  high: 5.0,  log: true}   # baseline 2.5
  tracking_ang_vel: {low: 0.1,  high: 2.0,  log: true}   # baseline 0.75
  style:            {low: 0.5,  high: 5.0,  log: true}   # baseline 2.0

  # ── Kontakt / Schritt ────────────────────────────────────────────────────
  feet_air_time:    {low: 1.0,  high: 12.0, log: true}   # baseline 4.0
  foot_clearance:   {low: 0.5,  high: 8.0,  log: true}   # baseline 3.0
  swing_clearance:  {low: -15.0, high: -1.0}              # baseline -5.0
  foot_air_excess:  {low: -10.0, high: -0.5}              # baseline -4.0
  feet_slip:        {low: -3.0,  high: -0.1}              # baseline -1.5
  leg_symmetry:     {low: -1.5,  high: -0.05}             # baseline -0.5

  # ── Regularizer ──────────────────────────────────────────────────────────
  action_rate:      {low: -0.25, high: -0.005}            # baseline -0.05
  dof_vel:          {low: -0.25, high: -0.005}            # baseline -0.05
  ang_vel_xy:       {low: -0.25, high: -0.005}            # baseline -0.05
  orientation:      {low: -1.5,  high: -0.05}             # baseline -0.5
  base_height:      {low: -3.0,  high: -0.1}              # baseline -1.0
  lin_vel_z:        {low: -2.0,  high: -0.05}             # baseline -0.5

objective:
  weights:
    # Task
    tracking_lin_vel: 3.0
    tracking_ang_vel: 1.5
    style: 2.0
    # Gait quality
    feet_air_time:   0.5
    foot_clearance:  1.0
    swing_clearance: 1.0   # raw ∈ [0,1]: höher = mehr Schlurfen (penalty term, aber raw positiv)
    foot_air_excess: 0.5   # raw ∈ [0,1]: höher = mehr Flamingo
    # Penalties (negative weight = schlechte raw-Werte senken Score)
    feet_slip:      -0.5
    orientation:    -0.3
    base_height:    -0.3
    lin_vel_z:      -0.2
